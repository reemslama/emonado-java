<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection de localisation</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        body {
            background: #edf6f2;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .leaflet-container {
            background: #e8f1f5;
        }

        .map-banner {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 14px;
            padding: 10px 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
            color: #0f172a;
            font-size: 12px;
            max-width: 240px;
        }

        .map-status {
            position: absolute;
            right: 12px;
            bottom: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.82);
            color: #f8fafc;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 11px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
        }
    </style>
</head>
<body>
<div class="map-banner">
    Cliquez sur la carte pour choisir la localisation du patient.
</div>
<div class="map-status" id="map-status">Carte en chargement...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
    const initialCenter = [36.8065, 10.1815];
    const worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
    const statusNode = document.getElementById('map-status');
    const map = L.map('map', {
        worldCopyJump: true,
        maxBounds: worldBounds,
        maxBoundsViscosity: 1.0,
        zoomControl: true
    }).setView(initialCenter, 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        minZoom: 3,
        noWrap: true,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;

    function normalizeLongitude(lng) {
        return ((((lng + 180) % 360) + 360) % 360) - 180;
    }

    function updateStatus(text) {
        if (statusNode) {
            statusNode.textContent = text;
        }
    }

    function updateMarker(lat, lng) {
        const normalizedLng = normalizeLongitude(lng);
        if (marker) {
            marker.setLatLng([lat, normalizedLng]);
        } else {
            marker = L.marker([lat, normalizedLng]).addTo(map);
        }
        marker.bindPopup(`Patient: ${lat.toFixed(6)}, ${normalizedLng.toFixed(6)}`).openPopup();
        updateStatus(`Position: ${lat.toFixed(4)}, ${normalizedLng.toFixed(4)}`);
    }

    function notifyJava(lat, lng) {
        const normalizedLng = normalizeLongitude(lng);
        document.title = `patient-location:${lat},${normalizedLng}`;
        if (window.javaConnector && typeof window.javaConnector.onLocationSelected === 'function') {
            window.javaConnector.onLocationSelected(lat, normalizedLng);
        }
    }

    map.on('click', function (event) {
        const lat = event.latlng.lat;
        const lng = normalizeLongitude(event.latlng.lng);
        updateMarker(lat, lng);
        notifyJava(lat, lng);
    });

    function setMarkerFromJava(lat, lng) {
        const normalizedLng = normalizeLongitude(lng);
        updateMarker(lat, normalizedLng);
        map.setView([lat, normalizedLng], 14);
    }

    function clearMarkerFromJava() {
        if (marker) {
            map.removeLayer(marker);
            marker = null;
        }
        map.setView(initialCenter, 12);
        updateStatus('Cliquez pour choisir la position');
    }

    function notifyUiReady() {
        updateStatus('Cliquez pour choisir la position');
        setTimeout(() => map.invalidateSize(true), 120);
        setTimeout(() => map.invalidateSize(true), 360);
        setTimeout(() => map.invalidateSize(true), 720);
    }

    window.addEventListener('resize', () => {
        setTimeout(() => map.invalidateSize(true), 50);
    });

    map.whenReady(() => {
        updateStatus('Cliquez pour choisir la position');
        setTimeout(() => map.invalidateSize(true), 150);
    });
</script>
</body>
</html>
